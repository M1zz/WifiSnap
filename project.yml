name: WifiSnap
options:
  # 번들 ID는 com.leeo.wifisnap 으로 고정한다. 한 번 앱스토어에 올라간 뒤로는
  # 바꾸면 다른 앱이 되어 버리므로(업데이트 불가, 기기의 저장 데이터·와이파이 설정 소실)
  # 절대 변경하지 말 것. 아래 preBuildScripts에서 빌드마다 검증한다.
  bundleIdPrefix: com.leeo
  deploymentTarget:
    iOS: "17.0"
    # 맥은 메뉴 막대 앱이다 (→ WifiSnap/Mac). LeeoKit 이 macOS 14 부터라 맞춘다.
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 서명 Team. .xcodeproj는 project.yml에서 생성되므로 Xcode UI에서만 지정하면
    # 다음 xcodegen generate에 지워진다 — 여기 적어야 유지된다. (앱·위젯 두 타깃 모두 적용)
    DEVELOPMENT_TEAM: QGAQ3AY3R3

packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    majorVersion: 3.54.0

# ⚠️ 스킴(xcshareddata/xcschemes)은 손으로 관리한다. WifiSnap 스킴의 실행에 StoreKit 설정
#    (WifiSnap.storekit)이 붙어 있어 시뮬레이터에서 요금제 구매를 시험할 수 있다.
#    xcodegen generate 는 스킴을 지우므로, 돌린 뒤 git checkout 으로 스킴을 되살린다.
targets:
  # 아이폰과 맥이 한 타깃 · 한 번들 ID 다 — 같은 App Store 레코드라 산 것이 맥에서도 이어진다.
  # 맥은 메뉴 막대에서 QR 을 크게 띄우고 안내판을 인쇄하는 것만 한다. 카메라 스캔 · 연결(NEHotspot) ·
  # 위젯 · 단축어는 아이폰 전용이라 아래 destinationFilters 로 아이폰에만 넣는다.
  WifiSnap:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: WifiSnap
        excludes:
          - "Views/**"
          - "Intents/**"
          - "Tips/**"
          - "Mac/**"
          - Models/KnownSSIDStore.swift
          - Services/CurrentNetworkService.swift
          - Services/PasswordLookalikes.swift
          - Services/SSIDMatcher.swift
          - Services/TextRecognizer.swift
          - Services/WifiConnector.swift
          - Services/WifiCredentialParser.swift
          - Services/WifiListParser.swift
          - Services/WifiQRPayload.swift
          - Shared/QRBrightness.swift
          - Shared/ScreenshotMode.swift
          - WifiSnapMac.entitlements
      # 아이폰 전용
      - path: WifiSnap/Views
        destinationFilters: [iOS]
      - path: WifiSnap/Intents
        destinationFilters: [iOS]
      - path: WifiSnap/Tips
        destinationFilters: [iOS]
      - path: WifiSnap/Models/KnownSSIDStore.swift
        destinationFilters: [iOS]
      - path: WifiSnap/Services/CurrentNetworkService.swift
        destinationFilters: [iOS]
      - path: WifiSnap/Services/PasswordLookalikes.swift
        destinationFilters: [iOS]
      - path: WifiSnap/Services/SSIDMatcher.swift
        destinationFilters: [iOS]
      - path: WifiSnap/Services/TextRecognizer.swift
        destinationFilters: [iOS]
      - path: WifiSnap/Services/WifiConnector.swift
        destinationFilters: [iOS]
      - path: WifiSnap/Services/WifiCredentialParser.swift
        destinationFilters: [iOS]
      - path: WifiSnap/Services/WifiListParser.swift
        destinationFilters: [iOS]
      - path: WifiSnap/Services/WifiQRPayload.swift
        destinationFilters: [iOS]
      - path: WifiSnap/Shared/QRBrightness.swift
        destinationFilters: [iOS]
      - path: WifiSnap/Shared/ScreenshotMode.swift
        destinationFilters: [iOS]
      # 맥 전용 — 메뉴 막대 · 큰 QR 창 · 안내판 인쇄
      - path: WifiSnap/Mac
        destinationFilters: [macOS]
    dependencies:
      - target: WifiSnapWidget
        destinationFilters: [iOS]
      - package: LeeoKit
    # CFBundleURLTypes(위젯 딥링크)는 INFOPLIST_KEY_* 로 넣을 수 없어 Info.plist를 명시한다
    info:
      path: WifiSnap/Info.plist
      properties:
        # 수출 규정: 운영체제 암호화(HTTPS 등)만 쓴다 — 심사 때 암호화 질문을 건너뛴다
        ITSAppUsesNonExemptEncryption: false
        # 홈 화면·설정에 보이는 이름. 타깃/번들 ID(com.leeo.wifisnap)는 기술 식별자라
        # 그대로 두고, 사용자에게 보이는 이름만 여기서 바꾼다.
        CFBundleDisplayName: 마이파이
        # 버전은 빌드 설정(MARKETING_VERSION / CURRENT_PROJECT_VERSION)을 따른다 — 여기 숫자를 박으면
        # xcodegen 이 1.0 / 1 로 써 버려 DeployBar 가 올린 번호가 무시된다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "와이파이 안내판을 촬영해 아이디와 비밀번호를 인식합니다."
        NSLocationWhenInUseUsageDescription: "현재 연결된 와이파이 이름을 확인하기 위해 필요합니다."
        # 맥: 위치 권한이 있어야 지금 와이파이 이름(CoreWLAN)을 읽는다
        NSLocationUsageDescription: "현재 연결된 와이파이 이름을 확인하기 위해 필요합니다."
        # 맥: Dock 없이 메뉴 막대에만 사는 앱 (아이폰은 이 키를 보지 않는다)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        # 위젯을 탭하면 wifisnap://qr 로 앱이 열린다
        CFBundleURLTypes:
          - CFBundleURLName: com.leeo.wifisnap
            CFBundleURLSchemes: [wifisnap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.wifisnap   # 고정 — 변경 금지
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WifiSnap/WifiSnap.entitlements
        # 맥은 샌드박스 · 인쇄 · 위치 권한이 따로 필요하고, 핫스팟 · 앱 그룹 권한은 없다
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": WifiSnap/WifiSnapMac.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      # 번들 ID가 실수로(Xcode UI 편집, 팀 자동설정 등) 바뀌면 빌드를 멈춘다
      - name: 번들 ID 고정 확인
        basedOnDependencyAnalysis: false
        script: |
          EXPECTED="com.leeo.wifisnap"
          if [ "$PRODUCT_BUNDLE_IDENTIFIER" != "$EXPECTED" ]; then
            echo "error: 번들 ID는 $EXPECTED 로 고정되어야 합니다 (현재: $PRODUCT_BUNDLE_IDENTIFIER). project.yml을 확인하세요."
            exit 1
          fi

  # 단위 테스트 — 파서·QR·이름 교정 같은 순수 로직.
  # 앱을 호스트로 띄우지 않고 해당 소스만 직접 컴파일한다: 앱을 띄우면 CloudKit·위치 권한 같은
  # 실행 환경이 필요해지고, 순수 로직 시험이 그 환경에 따라 깨진다. (위젯 타깃과 같은 방식)
  WifiSnapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WifiSnapTests
      - path: WifiSnap/Services/WifiQRPayload.swift
      - path: WifiSnap/Services/WifiCredentialParser.swift
      - path: WifiSnap/Services/SSIDMatcher.swift
      - path: WifiSnap/Services/PasswordLookalikes.swift
      - path: WifiSnap/Services/QRCodeGenerator.swift
      # 칸 · 상품 · 페이월 전 사용자 판정 (StoreKit 화면 없이 순수 규칙만)
      - path: WifiSnap/Store/Plan.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.wifisnap.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  # 홈 화면 와이파이 QR 위젯. 앱과는 App Group(group.com.leeo.wifisnap)으로만 데이터를 공유한다.
  WifiSnapWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WifiSnapWidget
        excludes:
          - Info.plist
          - WifiSnapWidget.entitlements
      # 위젯이 쓰는 것만 골라 넣는다 (앱 전체를 끌어오지 않도록)
      - path: WifiSnap/Models/SavedNetwork.swift
      - path: WifiSnap/Shared/SharedDefaults.swift
      - path: WifiSnap/Services/QRCodeGenerator.swift
    info:
      path: WifiSnapWidget/Info.plist
      properties:
        # GENERATE_INFOPLIST_FILE=NO이므로 INFOPLIST_KEY_* 는 무시된다 — 여기에 직접 적는다
        CFBundleDisplayName: 와이파이 QR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.wifisnap.widget   # 앱 번들 ID 하위여야 함
        CODE_SIGN_ENTITLEMENTS: WifiSnapWidget/WifiSnapWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
