name: WifiSnap
options:
  # 번들 ID는 com.leeo.wifisnap 으로 고정한다. 한 번 앱스토어에 올라간 뒤로는
  # 바꾸면 다른 앱이 되어 버리므로(업데이트 불가, 기기의 저장 데이터·와이파이 설정 소실)
  # 절대 변경하지 말 것. 아래 preBuildScripts에서 빌드마다 검증한다.
  bundleIdPrefix: com.leeo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 서명 Team. .xcodeproj는 project.yml에서 생성되므로 Xcode UI에서만 지정하면
    # 다음 xcodegen generate에 지워진다 — 여기 적어야 유지된다. (앱·위젯 두 타깃 모두 적용)
    DEVELOPMENT_TEAM: QGAQ3AY3R3

packages:
  LeeoKit:
    url: https://github.com/M1zz/LeeoKit.git
    majorVersion: 3.20.0

targets:
  WifiSnap:
    type: application
    platform: iOS
    sources:
      - path: WifiSnap
    dependencies:
      - target: WifiSnapWidget
      - package: LeeoKit
    # CFBundleURLTypes(위젯 딥링크)는 INFOPLIST_KEY_* 로 넣을 수 없어 Info.plist를 명시한다
    info:
      path: WifiSnap/Info.plist
      properties:
        # 수출 규정: 운영체제 암호화(HTTPS 등)만 쓴다 — 심사 때 암호화 질문을 건너뛴다
        ITSAppUsesNonExemptEncryption: false
        # 홈 화면·설정에 보이는 이름. 타깃/번들 ID(com.leeo.wifisnap)는 기술 식별자라
        # 그대로 두고, 사용자에게 보이는 이름만 여기서 바꾼다.
        CFBundleDisplayName: 마이파이
        # 버전은 빌드 설정(MARKETING_VERSION / CURRENT_PROJECT_VERSION)을 따른다 — 여기 숫자를 박으면
        # xcodegen 이 1.0 / 1 로 써 버려 DeployBar 가 올린 번호가 무시된다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "와이파이 안내판을 촬영해 아이디와 비밀번호를 인식합니다."
        NSLocationWhenInUseUsageDescription: "현재 연결된 와이파이 이름을 확인하기 위해 필요합니다."
        # 위젯을 탭하면 wifisnap://qr 로 앱이 열린다
        CFBundleURLTypes:
          - CFBundleURLName: com.leeo.wifisnap
            CFBundleURLSchemes: [wifisnap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.wifisnap   # 고정 — 변경 금지
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WifiSnap/WifiSnap.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      # 번들 ID가 실수로(Xcode UI 편집, 팀 자동설정 등) 바뀌면 빌드를 멈춘다
      - name: 번들 ID 고정 확인
        basedOnDependencyAnalysis: false
        script: |
          EXPECTED="com.leeo.wifisnap"
          if [ "$PRODUCT_BUNDLE_IDENTIFIER" != "$EXPECTED" ]; then
            echo "error: 번들 ID는 $EXPECTED 로 고정되어야 합니다 (현재: $PRODUCT_BUNDLE_IDENTIFIER). project.yml을 확인하세요."
            exit 1
          fi

  # 단위 테스트 — 파서·QR·이름 교정 같은 순수 로직.
  # 앱을 호스트로 띄우지 않고 해당 소스만 직접 컴파일한다: 앱을 띄우면 CloudKit·위치 권한 같은
  # 실행 환경이 필요해지고, 순수 로직 시험이 그 환경에 따라 깨진다. (위젯 타깃과 같은 방식)
  WifiSnapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WifiSnapTests
      - path: WifiSnap/Services/WifiQRPayload.swift
      - path: WifiSnap/Services/WifiCredentialParser.swift
      - path: WifiSnap/Services/SSIDMatcher.swift
      - path: WifiSnap/Services/QRCodeGenerator.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.wifisnap.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  # 홈 화면 와이파이 QR 위젯. 앱과는 App Group(group.com.leeo.wifisnap)으로만 데이터를 공유한다.
  WifiSnapWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WifiSnapWidget
        excludes:
          - Info.plist
          - WifiSnapWidget.entitlements
      # 위젯이 쓰는 것만 골라 넣는다 (앱 전체를 끌어오지 않도록)
      - path: WifiSnap/Models/SavedNetwork.swift
      - path: WifiSnap/Shared/SharedDefaults.swift
      - path: WifiSnap/Services/QRCodeGenerator.swift
    info:
      path: WifiSnapWidget/Info.plist
      properties:
        # GENERATE_INFOPLIST_FILE=NO이므로 INFOPLIST_KEY_* 는 무시된다 — 여기에 직접 적는다
        CFBundleDisplayName: 와이파이 QR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.wifisnap.widget   # 앱 번들 ID 하위여야 함
        CODE_SIGN_ENTITLEMENTS: WifiSnapWidget/WifiSnapWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
